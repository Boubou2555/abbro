<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BO-ME STORE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="store.css">
</head>
<body class="store-body">

<div id="topLoadingBar" class="top-loading-bar"></div>

<!-- Navbar -->
<nav class="navbar ios-navbar sticky-top">
  <div class="container-fluid">
    <a class="ios-brand" href="#">
      <span class="ios-brand-icon"><i class="bi bi-gem"></i></span>
      <span class="ios-brand-text">
        <span class="ios-brand-title d-block">BO-ME STORE</span>
        <span class="ios-brand-sub d-block">برهان</span>
      </span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <a id="contactBtn" class="ios-btn ios-btn-fill-green d-none" href="#" target="_blank" rel="noopener">
        <i class="bi bi-whatsapp"></i> تواصل معنا
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid py-3 px-3 px-md-4" style="max-width:720px;">

  <!-- Intro -->
  <div class="glass-panel store-intro mb-3">
    <h1 class="store-title">حسابات للبيع</h1>
    <p class="store-sub">اختر الحساب، اضغط زر النسخ، وأرسل لنا عبر واتساب لإتمام الشراء.</p>
  </div>

  <!-- Toolbar: search + sort -->
  <div class="glass-panel store-toolbar mb-3">
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input type="text" id="searchInput" placeholder="ابحث بالاسم...">
    </div>
    <select id="sortSelect" class="ios-select">
      <option value="newest">الأحدث أولاً</option>
      <option value="price_asc">السعر: من الأقل للأعلى</option>
      <option value="price_desc">السعر: من الأعلى للأقل</option>
      <option value="gems_desc">الجواهر: الأكثر أولاً</option>
    </select>
    <button id="clearFiltersBtn" class="ios-icon-btn" type="button" title="مسح الفلاتر">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- Summary bar -->
  <div class="store-summary">
    <span id="itemCountLabel"></span>
  </div>

  <!-- Accounts list -->
  <div id="accountsContainer" class="glass-panel acc-list mb-4"></div>

  <!-- Empty state -->
  <div id="emptyState" class="glass-panel store-empty d-none">
    <i class="bi bi-inbox d-block mb-3"></i>
    <p class="mb-0">لا توجد حسابات متاحة حالياً. عد لاحقاً.</p>
  </div>
</div>

<!-- Account detail modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content ios-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="detailModalTitle">تفاصيل الحساب</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="ios-btn ios-btn-glass" data-bs-dismiss="modal">إغلاق</button>
        <button type="button" class="ios-btn ios-btn-fill-green fw-bold" id="detailCopyCodeBtn">
          <i class="bi bi-clipboard-check"></i> نسخ
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast for feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="mainToast" class="toast align-items-center border-0 ios-toast" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Done</div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
