<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="pageTitle">Arena Breakout Loot Tracker</title>

<!-- Google Fonts: tactical typography (AR + EN) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;700;800&family=Cairo:wght@500;600;700&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

<!-- Bootstrap 5 (LTR by default; swapped to RTL build via JS on language toggle) -->
<link id="bootstrap-css" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark tactical-navbar sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand brand-logo" href="#">
      <i class="bi bi-crosshair2"></i>
      <span data-i18n="brand">ARENA LOOT TRACKER</span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <button id="langToggleBtn" class="btn btn-outline-warning btn-sm lang-toggle" type="button">
        <span id="langToggleLabel">العربية</span>
      </button>
      <button class="btn btn-warning btn-sm fw-bold" id="openAddModalBtn" type="button">
        <i class="bi bi-plus-lg"></i> <span data-i18n="addItem">Add Item</span>
      </button>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-3 px-md-4">

  <!-- Toolbar: search + filters -->
  <div class="row g-2 mb-4 toolbar-panel p-3">
    <div class="col-12 col-md-5">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" data-i18n-placeholder="searchPlaceholder" placeholder="Search items...">
      </div>
    </div>
    <div class="col-6 col-md-3">
      <select id="filterGrid" class="form-select">
        <option value="all" data-i18n="allGrids">All Grid Sizes</option>
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="4">4</option>
        <option value="6">6</option>
      </select>
    </div>
    <div class="col-6 col-md-3">
      <select id="filterRarity" class="form-select">
        <option value="all" data-i18n="allRarities">All Rarities</option>
        <option value="gold" data-i18n="rarityGold">Gold</option>
        <option value="purple" data-i18n="rarityPurple">Purple</option>
        <option value="blue" data-i18n="rarityBlue">Blue</option>
      </select>
    </div>
    <div class="col-12 col-md-1 d-grid">
      <button id="clearFiltersBtn" class="btn btn-outline-secondary btn-sm" type="button" data-i18n-title="clearFilters" title="Clear filters">
        <i class="bi bi-x-circle"></i>
      </button>
    </div>
  </div>

  <!-- Summary bar -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 summary-bar">
    <div>
      <span id="itemCountLabel" class="text-muted"></span>
    </div>
    <div>
      <span class="text-muted" data-i18n="totalValue">Total Value:</span>
      <span id="totalValueLabel" class="fw-bold text-warning">0</span>
      <span data-i18n="koen">Koen</span>
    </div>
  </div>

  <!-- Items grid -->
  <div id="itemsContainer" class="row g-3"></div>

  <!-- Empty state -->
  <div id="emptyState" class="text-center text-muted py-5 d-none">
    <i class="bi bi-box-seam display-1 d-block mb-3"></i>
    <p data-i18n="noItems">No items found. Start by adding your first loot item.</p>
  </div>
</div>

<!-- Add / Edit Item Modal -->
<div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content tactical-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="itemModalTitle" data-i18n="addItem">Add Item</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <form id="itemForm">
        <div class="modal-body">
          <input type="hidden" id="itemId">

          <!-- Autocomplete name field -->
          <div class="mb-3 position-relative">
            <label class="form-label" data-i18n="itemNameEn">Item Name (English)</label>
            <input type="text" class="form-control" id="itemNameInput" autocomplete="off"
                   data-i18n-placeholder="itemNamePlaceholder" placeholder="Type to search library..." required>
            <div id="autocompleteList" class="autocomplete-list d-none"></div>
            <small class="text-muted" data-i18n="autocompleteHint">Pick from the library or type a custom name.</small>
          </div>

          <div class="mb-3">
            <label class="form-label" data-i18n="itemNameAr">Item Name (Arabic)</label>
            <input type="text" class="form-control" id="itemNameArInput" dir="rtl" data-i18n-placeholder="itemNameArPlaceholder" placeholder="اسم القطعة بالعربي (اختياري)">
          </div>

          <div class="mb-3 d-flex align-items-center gap-3">
            <img id="imagePreview" src="https://placehold.co/80x80/2a2a2a/777?text=?" class="image-preview" alt="preview">
            <div class="flex-grow-1">
              <label class="form-label" data-i18n="imageUrl">Image URL</label>
              <input type="url" class="form-control" id="imageUrlInput" data-i18n-placeholder="imageUrlPlaceholder" placeholder="https://...">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label" data-i18n="uploadImage">Or upload a photo from your device</label>
            <input type="file" accept="image/*" class="form-control" id="imageFileInput">
          </div>

          <div class="row g-2">
            <div class="col-6">
              <label class="form-label" data-i18n="price">Price (Koen)</label>
              <input type="number" min="0" class="form-control" id="priceInput" placeholder="0" required>
            </div>
            <div class="col-6">
              <label class="form-label" data-i18n="gridSize">Grid / Slots</label>
              <select class="form-select" id="gridSizeInput" required>
                <option value="1">1</option>
                <option value="2">2</option>
                <option value="4">4</option>
                <option value="6">6</option>
              </select>
            </div>
          </div>

          <div class="mb-1 mt-2">
            <label class="form-label d-block" data-i18n="rarity">Rarity</label>
            <div class="btn-group w-100" role="group">
              <input type="radio" class="btn-check" name="rarity" id="rarityGold" value="gold" autocomplete="off">
              <label class="btn btn-outline-warning rarity-btn" for="rarityGold" data-i18n="rarityGold">Gold</label>

              <input type="radio" class="btn-check" name="rarity" id="rarityPurple" value="purple" autocomplete="off" checked>
              <label class="btn btn-outline-purple rarity-btn" for="rarityPurple" data-i18n="rarityPurple">Purple</label>

              <input type="radio" class="btn-check" name="rarity" id="rarityBlue" value="blue" autocomplete="off">
              <label class="btn btn-outline-info rarity-btn" for="rarityBlue" data-i18n="rarityBlue">Blue</label>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
          <button type="submit" class="btn btn-warning fw-bold" data-i18n="save">Save</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content tactical-modal">
      <div class="modal-header">
        <h5 class="modal-title" data-i18n="confirmDeleteTitle">Confirm Delete</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p class="mb-0" data-i18n="confirmDeleteBody">Are you sure you want to delete this item? This action cannot be undone.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" data-i18n="cancel">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn" data-i18n="delete">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- Toast for feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="mainToast" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Done</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
