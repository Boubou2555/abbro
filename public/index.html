<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متجر الحسابات</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="topLoadingBar" class="top-loading-bar"></div>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg tactical-navbar sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand brand-logo" href="#">
      <i class="bi bi-controller"></i>
      <span>متجر الحسابات</span>
    </a>
    <div class="d-flex align-items-center gap-2 ms-auto">
      <a id="contactBtn" class="btn btn-success btn-sm fw-bold d-none" href="#" target="_blank" rel="noopener">
        <i class="bi bi-whatsapp"></i> تواصل معنا
      </a>
      <a class="btn btn-outline-light btn-sm" href="admin.html">
        <i class="bi bi-shield-lock"></i> لوحة التحكم
      </a>
    </div>
  </div>
</nav>

<div class="container-fluid py-4 px-3 px-md-4">

  <!-- Intro -->
  <div class="storefront-intro mb-4">
    <h1 class="storefront-title"><i class="bi bi-gem"></i> حسابات للبيع</h1>
    <p class="storefront-sub">
      اختر الحساب الذي يعجبك، انسخ <strong>كود الحساب</strong> وأرسله لنا عبر واتساب لإتمام عملية الشراء.
    </p>
  </div>

  <!-- Toolbar: search + sort -->
  <div class="row g-2 mb-4 toolbar-panel p-3">
    <div class="col-12 col-md-6">
      <div class="input-group">
        <span class="input-group-text"><i class="bi bi-search"></i></span>
        <input type="text" id="searchInput" class="form-control" placeholder="ابحث بكود الحساب أو الاسم...">
      </div>
    </div>
    <div class="col-8 col-md-4">
      <select id="sortSelect" class="form-select">
        <option value="newest">الأحدث أولاً</option>
        <option value="price_asc">السعر: من الأقل للأعلى</option>
        <option value="price_desc">السعر: من الأعلى للأقل</option>
        <option value="gems_desc">الجواهر: الأكثر أولاً</option>
      </select>
    </div>
    <div class="col-4 col-md-2 d-grid">
      <button id="clearFiltersBtn" class="btn btn-outline-secondary btn-sm" type="button" title="مسح الفلاتر">
        <i class="bi bi-x-circle"></i>
      </button>
    </div>
  </div>

  <!-- Summary bar -->
  <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 summary-bar">
    <span id="itemCountLabel" class="text-muted"></span>
  </div>

  <!-- Accounts grid -->
  <div id="accountsContainer" class="accounts-grid"></div>

  <!-- Empty state -->
  <div id="emptyState" class="text-center text-muted py-5 d-none">
    <i class="bi bi-inbox display-1 d-block mb-3"></i>
    <p>لا توجد حسابات متاحة حالياً. عد لاحقاً.</p>
  </div>
</div>

<!-- Account detail modal -->
<div class="modal fade" id="detailModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content tactical-modal">
      <div class="modal-header">
        <h5 class="modal-title" id="detailModalTitle">تفاصيل الحساب</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="detailModalBody"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
        <button type="button" class="btn btn-success fw-bold" id="detailCopyCodeBtn">
          <i class="bi bi-clipboard-check"></i> نسخ الكود
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Toast for feedback -->
<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="mainToast" class="toast align-items-center border-0 glass-toast" role="alert">
    <div class="d-flex">
      <div class="toast-body" id="toastBody">Done</div>
      <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
